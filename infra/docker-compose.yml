services:
  postgres:
    image: postgres:17
    container_name: agentpass-postgres
    environment:
      POSTGRES_USER: agentpass
      POSTGRES_PASSWORD: agentpass
      POSTGRES_DB: agentpass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentpass -d agentpass"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    container_name: agentpass-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    container_name: agentpass-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: agentpass
      MINIO_ROOT_PASSWORD: agentpass-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    container_name: agentpass-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: Dockerfile
      target: api
    container_name: agentpass-migrate
    command: sh -c "pnpm db:deploy && pnpm db:seed"
    environment: &app-env
      NODE_ENV: development
      API_PORT: 3001
      API_BASE_URL: http://api:3001
      DATABASE_URL: postgresql://agentpass:agentpass@postgres:5432/agentpass
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: local-dev-access-secret-change-me
      JWT_REFRESH_SECRET: local-dev-refresh-secret-change-me
      VAULT_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      S3_ENDPOINT: http://minio:9000
      S3_REGION: local
      S3_BUCKET: agentpass-local
      S3_ACCESS_KEY: agentpass
      S3_SECRET_KEY: agentpass-secret
      S3_FORCE_PATH_STYLE: "true"
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM: AgentPass Local <agentpass@localhost>
      DASHBOARD_BASE_URL: http://localhost:3000
      WORKER_INTERNAL_TOKEN: local-worker-token-change-me
      VENDOR_SANDBOX_URL: http://vendor-sandbox:4202
      API_ALLOWED_ORIGINS: http://localhost:3000,http://web:3000
      ENABLE_OPENAPI: "true"
      ALLOW_LOCAL_PRODUCTION_DEPENDENCIES: "true"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: Dockerfile
      target: api
    container_name: agentpass-api
    environment:
      <<: *app-env
    ports:
      - "3001:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: Dockerfile
      target: worker
    container_name: agentpass-worker
    environment:
      <<: *app-env
    depends_on:
      api:
        condition: service_healthy
      vendor-sandbox:
        condition: service_healthy

  vendor-sandbox:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: Dockerfile
      target: vendor-sandbox
    container_name: agentpass-vendor-sandbox
    environment:
      NODE_ENV: development
      VENDOR_SANDBOX_PORT: 4202
    ports:
      - "4202:4202"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4202/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 20

  web:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: Dockerfile
      target: web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL must be an HTTPS URL for production web builds}
        NEXT_PUBLIC_ENABLE_DEMO_MODE: "false"
        NEXT_PUBLIC_ENABLE_FIXTURE_FALLBACK: "false"
        NEXT_PUBLIC_ALLOW_LOCAL_API_URL: "false"
    container_name: agentpass-web
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL must be configured}
      NEXT_PUBLIC_ENABLE_DEMO_MODE: "false"
      NEXT_PUBLIC_ENABLE_FIXTURE_FALLBACK: "false"
      NEXT_PUBLIC_ALLOW_LOCAL_API_URL: "false"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  minio-data:
