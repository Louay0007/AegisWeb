# Nginx front door for AegisWeb VPS demo (HTTP on the server IP).
# Installed to: /etc/nginx/sites-available/aegisweb

upstream aegisweb_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream aegisweb_api {
    server 127.0.0.1:3001;
    keepalive 32;
}

upstream aegisweb_sandbox {
    server 127.0.0.1:4202;
    keepalive 8;
}

upstream aegisweb_mail {
    server 127.0.0.1:8025;
    keepalive 8;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 80.240.27.4 _;

    client_max_body_size 32m;

    # Public Nest API under /v1/ (keeps Next.js /api/* BFF routes free).
    location /v1/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_pass http://aegisweb_api/;
    }

    location = /v1 {
        return 301 /v1/;
    }

    # Vendor sandbox (demo SaaS portals)
    location /sandbox/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://aegisweb_sandbox/;
    }

    location = /sandbox {
        return 301 /sandbox/;
    }

    # Mailpit UI (demo outbound mail)
    location /mail/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://aegisweb_mail/;
    }

    location = /mail {
        return 301 /mail/;
    }

    # Tester guide PDF
    location = /guide.pdf {
        alias /opt/aegisweb/public/aegisweb-demo-tester-guide.pdf;
        default_type application/pdf;
        add_header Content-Disposition 'inline; filename="aegisweb-demo-tester-guide.pdf"';
    }

    # Next.js dashboard + marketing + BFF
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://aegisweb_web;
    }
}
