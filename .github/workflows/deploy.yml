name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: Deploy or rollback
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - rollback
      rollback_sha:
        description: Git SHA / image tag to roll back to (rollback only)
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.25.0'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  deploy-staging:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.action == 'deploy' }}
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      api_digest: ${{ steps.digests.outputs.api_digest }}
      worker_digest: ${{ steps.digests.outputs.worker_digest }}
      web_digest: ${{ steps.digests.outputs.web_digest }}
      image_tag: ${{ steps.digests.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Build and push images
        id: digests
        run: |
          set -euo pipefail
          IMAGE_PREFIX_LOWER=$(printf '%s' "$IMAGE_PREFIX" | tr '[:upper:]' '[:lower:]')
          TAG="${{ github.sha }}"
          docker build --target api -t "$IMAGE_PREFIX_LOWER/api:$TAG" .
          docker build --target worker -t "$IMAGE_PREFIX_LOWER/worker:$TAG" .
          docker build --target web --build-arg NEXT_PUBLIC_API_URL=${{ vars.STAGING_API_URL }} -t "$IMAGE_PREFIX_LOWER/web:$TAG" .
          docker push "$IMAGE_PREFIX_LOWER/api:$TAG"
          docker push "$IMAGE_PREFIX_LOWER/worker:$TAG"
          docker push "$IMAGE_PREFIX_LOWER/web:$TAG"
          API_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_PREFIX_LOWER/api:$TAG")
          WORKER_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_PREFIX_LOWER/worker:$TAG")
          WEB_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_PREFIX_LOWER/web:$TAG")
          echo "api_digest=$API_DIGEST" >> "$GITHUB_OUTPUT"
          echo "worker_digest=$WORKER_DIGEST" >> "$GITHUB_OUTPUT"
          echo "web_digest=$WEB_DIGEST" >> "$GITHUB_OUTPUT"
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$API_DIGEST" "$WORKER_DIGEST" "$WEB_DIGEST" > image-digests.txt
      - uses: actions/upload-artifact@v4
        with:
          name: image-digests-${{ github.sha }}
          path: image-digests.txt
      - name: Run staging migrations
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: pnpm db:deploy
      - name: Deploy Render staging services
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_SERVICE_ID: ${{ secrets.RENDER_STAGING_API_SERVICE_ID }}
          RENDER_WORKER_SERVICE_ID: ${{ secrets.RENDER_STAGING_WORKER_SERVICE_ID }}
          RENDER_WEB_SERVICE_ID: ${{ secrets.RENDER_STAGING_WEB_SERVICE_ID }}
          IMAGE_TAG: ${{ steps.digests.outputs.image_tag }}
          API_DIGEST: ${{ steps.digests.outputs.api_digest }}
          WORKER_DIGEST: ${{ steps.digests.outputs.worker_digest }}
          WEB_DIGEST: ${{ steps.digests.outputs.web_digest }}
        run: |
          echo "Deploying staging images tag=$IMAGE_TAG"
          echo "api=$API_DIGEST"
          echo "worker=$WORKER_DIGEST"
          echo "web=$WEB_DIGEST"
          for service_id in "$RENDER_API_SERVICE_ID" "$RENDER_WORKER_SERVICE_ID" "$RENDER_WEB_SERVICE_ID"; do
            curl --fail --silent --show-error --request POST \
              --url "https://api.render.com/v1/services/$service_id/deploys" \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              --header "Content-Type: application/json" \
              --data '{"clearCache":"do_not_clear"}'
          done
      - name: Run staging smoke tests
        env:
          API_BASE_URL: ${{ vars.STAGING_API_URL }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          REDIS_URL: ${{ secrets.STAGING_REDIS_URL }}
          S3_ENDPOINT: ${{ secrets.STAGING_S3_ENDPOINT }}
          S3_REGION: ${{ secrets.STAGING_S3_REGION }}
          S3_BUCKET: ${{ secrets.STAGING_S3_BUCKET }}
          S3_ACCESS_KEY: ${{ secrets.STAGING_S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.STAGING_S3_SECRET_KEY }}
        run: pnpm smoke
      - name: Run staging happy path
        env:
          API_BASE_URL: ${{ vars.STAGING_API_URL }}
          WEB_BASE_URL: ${{ vars.STAGING_WEB_URL }}
          E2E_API_URL: ${{ vars.STAGING_API_URL }}
          E2E_WEB_URL: ${{ vars.STAGING_WEB_URL }}
        run: pnpm e2e:happy

  deploy-production:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.action == 'deploy' }}
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Run production migrations
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: pnpm db:deploy
      - name: Promote Render production services
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_SERVICE_ID: ${{ secrets.RENDER_PRODUCTION_API_SERVICE_ID }}
          RENDER_WORKER_SERVICE_ID: ${{ secrets.RENDER_PRODUCTION_WORKER_SERVICE_ID }}
          RENDER_WEB_SERVICE_ID: ${{ secrets.RENDER_PRODUCTION_WEB_SERVICE_ID }}
          IMAGE_TAG: ${{ needs.deploy-staging.outputs.image_tag }}
          API_DIGEST: ${{ needs.deploy-staging.outputs.api_digest }}
          WORKER_DIGEST: ${{ needs.deploy-staging.outputs.worker_digest }}
          WEB_DIGEST: ${{ needs.deploy-staging.outputs.web_digest }}
        run: |
          echo "Promoting production images tag=$IMAGE_TAG"
          echo "api=$API_DIGEST"
          echo "worker=$WORKER_DIGEST"
          echo "web=$WEB_DIGEST"
          for service_id in "$RENDER_API_SERVICE_ID" "$RENDER_WORKER_SERVICE_ID" "$RENDER_WEB_SERVICE_ID"; do
            curl --fail --silent --show-error --request POST \
              --url "https://api.render.com/v1/services/$service_id/deploys" \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              --header "Content-Type: application/json" \
              --data '{"clearCache":"do_not_clear"}'
          done
      - name: Production health checks
        run: |
          curl --fail --silent --show-error --max-time 30 ${{ vars.PRODUCTION_API_URL }}/health
          curl --fail --silent --show-error --max-time 30 ${{ vars.PRODUCTION_API_URL }}/health/ready
          curl --fail --silent --show-error --max-time 30 ${{ vars.PRODUCTION_WEB_URL }}/login
      - name: Production smoke
        env:
          API_BASE_URL: ${{ vars.PRODUCTION_API_URL }}
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          REDIS_URL: ${{ secrets.PRODUCTION_REDIS_URL }}
          S3_ENDPOINT: ${{ secrets.PRODUCTION_S3_ENDPOINT }}
          S3_REGION: ${{ secrets.PRODUCTION_S3_REGION }}
          S3_BUCKET: ${{ secrets.PRODUCTION_S3_BUCKET }}
          S3_ACCESS_KEY: ${{ secrets.PRODUCTION_S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.PRODUCTION_S3_SECRET_KEY }}
        run: pnpm smoke

  rollback-production:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'rollback' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate rollback SHA
        run: |
          if [ -z "${{ inputs.rollback_sha }}" ]; then
            echo "rollback_sha is required for rollback"
            exit 1
          fi
      - name: Redeploy previous image tag
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_SERVICE_ID: ${{ secrets.RENDER_PRODUCTION_API_SERVICE_ID }}
          RENDER_WORKER_SERVICE_ID: ${{ secrets.RENDER_PRODUCTION_WORKER_SERVICE_ID }}
          RENDER_WEB_SERVICE_ID: ${{ secrets.RENDER_PRODUCTION_WEB_SERVICE_ID }}
          ROLLBACK_SHA: ${{ inputs.rollback_sha }}
        run: |
          echo "Rolling back production services to image tag=$ROLLBACK_SHA"
          for service_id in "$RENDER_API_SERVICE_ID" "$RENDER_WORKER_SERVICE_ID" "$RENDER_WEB_SERVICE_ID"; do
            curl --fail --silent --show-error --request POST \
              --url "https://api.render.com/v1/services/$service_id/deploys" \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              --header "Content-Type: application/json" \
              --data '{"clearCache":"clear"}'
          done
      - name: Production health checks after rollback
        run: |
          curl --fail --silent --show-error --max-time 30 ${{ vars.PRODUCTION_API_URL }}/health
          curl --fail --silent --show-error --max-time 30 ${{ vars.PRODUCTION_API_URL }}/health/ready
          curl --fail --silent --show-error --max-time 30 ${{ vars.PRODUCTION_WEB_URL }}/login
