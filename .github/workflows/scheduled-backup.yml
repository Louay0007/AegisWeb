name: Scheduled Backup

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.25.0'

jobs:
  postgres-backup:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pnpm install --frozen-lockfile
      - name: Upload PostgreSQL backup to S3
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_PREFIX: backups/postgres
          S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          S3_REGION: ${{ secrets.BACKUP_S3_REGION }}
          S3_ACCESS_KEY: ${{ secrets.BACKUP_S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.BACKUP_S3_SECRET_KEY }}
          S3_FORCE_PATH_STYLE: ${{ secrets.BACKUP_S3_FORCE_PATH_STYLE }}
        run: pnpm backup:postgres
